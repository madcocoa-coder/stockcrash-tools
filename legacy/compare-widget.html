<div id="cmp-root" data-sheet="1JP-4PJimOphXB9pTvG8xCW4F12Jn5FrnHVUiT4iRVFM">
<style>
#cmp-root{--red:#b0352b;--ink:#14161a;--muted:#5f6873;--bd:#d7dbe0;--bg2:#f4f5f7;font-size:15px;line-height:1.6;color:var(--ink)}
#cmp-root *{box-sizing:border-box}
#cmp-root .c-lead{font-size:16px;font-weight:bold;border-left:4px solid var(--red);padding:8px 12px;background:#fdf3f2;margin:0 0 12px;min-height:44px}
#cmp-root .c-row{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:0 0 10px}
#cmp-root .c-lab{font-size:12px;color:var(--muted)}
#cmp-root .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:999px;padding:3px 6px 3px 10px;font-size:13px;background:#fff;line-height:1.4}
#cmp-root .chip i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
#cmp-root .chip button{all:unset;cursor:pointer;color:var(--muted);font-size:15px;padding:0 4px;line-height:1}
#cmp-root select{font-size:14px;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:#fff;max-width:100%;color:var(--ink)}
#cmp-root .seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
#cmp-root .seg button,#cmp-root .btn{all:unset;cursor:pointer;padding:5px 11px;font-size:13px;color:var(--muted);background:#fff}
#cmp-root .seg button+button{border-left:1px solid var(--bd)}
#cmp-root .seg button.on{background:var(--ink);color:#fff}
#cmp-root .btn{border:1px solid var(--bd);border-radius:8px}
#cmp-root .btn:hover,#cmp-root .seg button:hover{background:var(--bg2)}
#cmp-root .seg button.on:hover{background:var(--ink)}
#cmp-root .c-fig{position:relative;border:1px solid var(--bd);border-radius:10px;padding:6px 4px 0;background:#fff}
#cmp-root svg{width:100%;height:auto;display:block;touch-action:pan-y;cursor:crosshair}
#cmp-root .c-read{font-size:13px;margin:8px 0 14px;min-height:24px}
#cmp-root .c-read span{display:inline-block;margin-right:12px;white-space:nowrap}
#cmp-root .c-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--bd);border-radius:10px}
#cmp-root table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px;margin:0}
#cmp-root th,#cmp-root td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
#cmp-root th{background:#eceef1;font-weight:bold}
#cmp-root th:first-child,#cmp-root td:first-child{text-align:left;white-space:normal;min-width:180px}
#cmp-root td b{font-size:14px}
#cmp-root .neg{color:var(--red)}
#cmp-root .c-note{font-size:12px;color:var(--muted);margin-top:8px}
#cmp-root .c-msg{font-size:13px;color:var(--muted);padding:40px 8px;text-align:center}
</style>
<div class="c-lead">データを読み込み中…</div>
<div class="c-row"><span class="c-lab">比べる暴落</span><span class="c-chips"></span></div>
<div class="c-row"><select class="c-add"><option value="">＋ 暴落を追加</option></select><button class="btn c-sim" type="button">今回に近い下落を探す</button><button class="btn c-main" type="button">主な暴落に戻す</button></div>
<div class="c-row"><span class="c-lab">表示期間</span><span class="seg c-range"><button data-v="90">3か月</button><button data-v="180">半年</button><button data-v="365" class="on">1年</button><button data-v="730">2年</button><button data-v="1095">3年</button></span></div>
<div class="c-fig"><div class="c-msg">データを読み込み中…</div></div>
<div class="c-read c-lab">グラフをタップ（なぞる）と、その日数時点の下落率を表示</div>
<div class="c-wrap"><table><thead><tr><th>暴落</th><th>ピーク</th><th>最大下落</th><th>底まで</th><th>高値回復まで</th><th class="c-dayh">—</th></tr></thead><tbody></tbody></table></div>
<div class="c-note">横軸はピーク（直前の最高値）からの経過日数（暦日）、縦軸はピーク終値からの騰落率。S&amp;P500の日次終値（配当含まず）。1928年以降の、高値から10%以上下げた局面が対象。データは毎週更新。</div>
<script>
(function(){
var R=document.getElementById('cmp-root');if(!R)return;
var SID=R.dataset.sheet,BASE='https://docs.google.com/spreadsheets/d/'+SID+'/gviz/tq?tqx=out:csv\x26gid=';
var COL=['#b0352b','#233b5e','#1a8c80','#b28430','#6b4fa0','#8a94a0'],DAY=864e5,MAXSEL=6;
var EV=[],BY={},SEL=[],CACHE={},range=365,cur=null,ALL=null;
function esc(s){return String(s).replace(/[\x26<>"']/g,function(c){return '\x26#'+c.charCodeAt(0)+';'})}
function csv(t){var o=[],r=[],f='',q=false;t=t.replace(/\r/g,'');for(var i=0;i<t.length;i++){var c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'){r.push(f);o.push(r);r=[];f=''}else f+=c}if(f||r.length){r.push(f);o.push(r)}return o}
function num(s){s=(s||'').replace(/[,\s%]/g,'');return s===''?NaN:+s}
function dt(s){var m=(s||'').trim().replace(/\//g,'-').match(/^(\d{4})-(\d{1,2})(?:-(\d{1,2}))?/);return m?Date.UTC(+m[1],+m[2]-1,+(m[3]||1)):null}
function iso(t){return new Date(t).toISOString().slice(0,10)}
function fd(t){var d=new Date(t);return d.getUTCFullYear()+'/'+(d.getUTCMonth()+1)+'/'+d.getUTCDate()}
function dur(x){if(x==null)return '—';if(x<60)return Math.round(x)+'日';var m=Math.round(x/30.44);return m<24?m+'か月':(Math.floor(m/12)+'年'+(m%12?m%12+'か月':''))}
function pct(x){return (x>0?'+':'')+(x*100).toFixed(1)+'%'}
function get(gid,tq){return fetch(BASE+gid+(tq?'\x26tq='+encodeURIComponent(tq):''),{cache:'no-store'}).then(function(r){if(!r.ok)throw r.status;return r.text()})}
function short(n,e){if(e){if(e.on)return '今回'}var b=n.replace(/^\d{4}(〜\d{2,4})?年\s*/,''),m=b.match(/（(.*?)）/);if(m){if(/ショック/.test(m[1]))return m[1];return b.replace(/（.*?）/g,'')}return b}
function label(e){return e.name}
function init(t){
 var a=csv(t),h=a.shift(),ix=function(n){return h.indexOf(n)};
 var I={id:ix('ID'),n:ix('名称'),pd:ix('ピーク日'),pv:ix('ピーク値'),td:ix('底日'),tv:ix('底値'),rd:ix('回復日'),gr:ix('データ')};
 a.forEach(function(r){var pk=dt(r[I.pd]),tr=dt(r[I.td]),pv=num(r[I.pv]),tv=num(r[I.tv]);if(!pk||!tr||!(pv>0)||!(tv>0))return;if((r[I.gr]||'').indexOf('月次')>=0)return;
  var rc=dt(r[I.rd]),e={id:r[I.id],name:esc(r[I.n]),pk:pk,tr:tr,rc:rc,pv:pv,tv:tv,dd:tv/pv-1,bear:tv/pv-1<=-0.2,on:!rc};EV.push(e);BY[e.id]=e});
 var sel=R.querySelector('.c-add'),grp={b:'弱気相場（-20%以上）',c:'調整（-10〜20%）'},html='';
 ['b','c'].forEach(function(g){html+='<optgroup label="'+grp[g]+'">'+EV.filter(function(e){return (g=='b')==e.bear}).slice().reverse().map(function(e){return '<option value="'+e.id+'">'+label(e)+'（'+pct(e.dd)+'）<\/option>'}).join('')+'<\/optgroup>'});
 sel.insertAdjacentHTML('beforeend',html);
 sel.addEventListener('change',function(){if(sel.value)add(sel.value);sel.value=''});
 R.querySelector('.c-main').addEventListener('click',function(){setSel(defaults())});
 R.querySelector('.c-sim').addEventListener('click',similar);
 R.querySelector('.c-range').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;R.querySelectorAll('.c-range button').forEach(function(x){x.classList.toggle('on',x===b)});range=+b.dataset.v;if(cur!=null)cur=Math.min(cur,range);draw()});
 R.querySelector('.c-chips').addEventListener('click',function(ev){var b=ev.target.closest('button');if(b){SEL=SEL.filter(function(x){return x!=b.dataset.id});update()}});
 window.addEventListener('resize',function(){clearTimeout(R._t);R._t=setTimeout(draw,150)});
 var hs=(location.hash.match(/cmp=([\w,]+)/)||[])[1],ids=hs?hs.split(',').filter(function(i){return BY[i]}):[];
 setSel(ids.length?ids:defaults())}
function find(re){return EV.filter(function(e){return re.test(e.name)})[0]}
function defaults(){var o=[],on=EV.filter(function(e){return e.on})[0];if(on)o.push(on.id);[/リーマン/,/コロナ/,/2022年/,/ブラックマンデー/].forEach(function(re){var e=find(re);if(e)o.push(e.id)});return o.slice(0,MAXSEL)}
function setSel(ids){SEL=ids.slice(0,MAXSEL);cur='auto';update()}
function add(id){if(SEL.indexOf(id)>=0)return;if(SEL.length>=MAXSEL)SEL.pop();SEL.push(id);update()}
function update(){
 try{history.replaceState(null,'','#cmp='+SEL.join(','))}catch(e){}
 R.querySelector('.c-chips').innerHTML=SEL.map(function(id,i){var e=BY[id];return '<span class="chip"><i style="background:'+COL[i]+'"><\/i>'+short(e.name,e)+' '+new Date(e.pk).getUTCFullYear()+'<button type="button" aria-label="外す" data-id="'+id+'">×<\/button><\/span>'}).join('');
 Promise.all(SEL.map(load)).then(draw).catch(function(){R.querySelector('.c-fig').innerHTML='<div class="c-msg">データを読み込めませんでした。時間をおいて再読み込みしてください。<\/div>'})}
function load(id){
 if(CACHE[id])return Promise.resolve(CACHE[id]);var e=BY[id];
 if(ALL){CACHE[id]=slice(ALL,e);return Promise.resolve(CACHE[id])}
 var to=e.on?Date.now()+DAY:e.pk+1100*DAY;
 return get(DGID,'select A,B where A >= date \''+iso(e.pk)+'\' and A <= date \''+iso(to)+'\' order by A').then(function(t){var r=csv(t);r.shift();CACHE[id]=path(r.map(function(x){return [dt(x[0]),num(x[1])]}),e);return CACHE[id]})}
function path(rows,e){var base=null,o=[];rows.forEach(function(x){if(!x[0]||!(x[1]>0))return;if(base==null)base=x[1];o.push([(x[0]-e.pk)/DAY,x[1]/base-1])});return o}
function slice(all,e){var to=e.pk+1100*DAY;return path(all.filter(function(x){return x[0]>=e.pk}).filter(function(x){return x[0]<=to}),e)}
function at(p,d){var v=null;for(var i=0;i<p.length;i++){if(p[i][0]>d)break;v=p[i][1]}return v}
function draw(){
 var box=R.querySelector('.c-fig'),W=Math.max(300,box.clientWidth-8),mob=W<560,H=mob?320:420,m={l:mob?40:48,r:mob?10:16,t:12,b:26};
 var L0=SEL.map(function(id){return BY[id]}).filter(function(e){return e.on})[0];if(cur==='auto'){var lp=L0?(CACHE[L0.id]||[]):[];cur=lp.length?Math.min(Math.round(lp[lp.length-1][0]),range):null}
 var L=SEL.map(function(id,i){return {e:BY[id],c:COL[i],p:(CACHE[id]||[]).filter(function(x){return x[0]<=range})}});
 var lo=-0.05,hi=0.05;L.forEach(function(l){l.p.forEach(function(x){lo=Math.min(lo,x[1]);hi=Math.max(hi,x[1])})});lo=Math.floor(lo*20-0.5)/20;hi=Math.min(Math.ceil(hi*20+0.2)/20,0.4);
 var X=function(d){return m.l+d/range*(W-m.l-m.r)},Y=function(v){return m.t+(hi-v)/(hi-lo)*(H-m.t-m.b)},s='';
 var step=(hi-lo)>0.6?0.2:(hi-lo)>0.3?0.1:0.05;
 for(var v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step){var y=Y(v).toFixed(1),z=Math.abs(v)<1e-9;s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y+'" y2="'+y+'" stroke="'+(z?'#9aa1a9':'#eceef1')+'" stroke-width="'+(z?1.2:1)+'"/><text x="'+(m.l-5)+'" y="'+y+'" dy="4" font-size="10" text-anchor="end" fill="#5f6873">'+Math.round(v*100)+'%<\/text>'}
 var xs=range<=90?30:range<=180?30:range<=365?90:range<=730?180:365;
 for(var d=0;d<=range;d+=xs){var x=X(d).toFixed(1);s+='<line x1="'+x+'" x2="'+x+'" y1="'+m.t+'" y2="'+(H-m.b)+'" stroke="#f4f5f7"/><text x="'+x+'" y="'+(H-8)+'" font-size="10" text-anchor="middle" fill="#5f6873">'+(d?d+'日':'ピーク')+'<\/text>'}
 L.slice().reverse().forEach(function(l){if(!l.p.length)return;var d2='';l.p.forEach(function(x,i){d2+=(i?'L':'M')+X(x[0]).toFixed(1)+' '+Y(Math.min(x[1],hi)).toFixed(1)});
  s+='<path d="'+d2+'" fill="none" stroke="'+l.c+'" stroke-width="'+(l.e.on?3:2)+'" stroke-linejoin="round" opacity="'+(l.e.on?1:.9)+'"/>';
  var mn=l.p.reduce(function(a,x){return x[1]<a[1]?x:a});s+='<circle cx="'+X(mn[0]).toFixed(1)+'" cy="'+Y(mn[1]).toFixed(1)+'" r="3.5" fill="'+l.c+'"/>';
  if(l.e.on){var z=l.p[l.p.length-1];s+='<circle cx="'+X(z[0]).toFixed(1)+'" cy="'+Y(z[1]).toFixed(1)+'" r="5" fill="#fff" stroke="'+l.c+'" stroke-width="2.5"/>'}});
 if(cur!=null){var cx=X(cur).toFixed(1);s+='<line x1="'+cx+'" x2="'+cx+'" y1="'+m.t+'" y2="'+(H-m.b)+'" stroke="#14161a" stroke-dasharray="3 3"/><text x="'+cx+'" y="'+(m.t+10)+'" dx="4" font-size="10" fill="#14161a">'+Math.round(cur)+'日目<\/text>'}
 box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="暴落の比較チャート">'+s+'<rect class="hit" x="'+m.l+'" y="'+m.t+'" width="'+(W-m.l-m.r)+'" height="'+(H-m.t-m.b)+'" fill="transparent"/><\/svg>';
 var sv=box.querySelector('svg');
 function mv(ev){var r=sv.getBoundingClientRect(),px=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;px=px*W/r.width;var d=(px-m.l)/(W-m.l-m.r)*range;if(d<0||d>range)return;cur=Math.round(d);draw()}
 sv.addEventListener('click',mv);sv.addEventListener('mousemove',mv);sv.addEventListener('touchmove',function(ev){mv(ev)},{passive:true});
 table(L);lead(L)}
function table(L){
 var d=cur==null?null:Math.round(cur);R.querySelector('.c-dayh').textContent=d==null?'—':d+'日目の騰落率';
 R.querySelector('tbody').innerHTML=L.map(function(l){var e=l.e,full=CACHE[e.id]||[],v=d==null?null:at(full,d),rc=e.rc?Math.round((e.rc-e.pk)/DAY):null,mn=full.filter(function(x){return rc==null||x[0]<=rc}).reduce(function(a,x){return x[1]<a[1]?x:a},[Math.round((e.tr-e.pk)/DAY),e.dd]),tv=Math.round(mn[0]);
  return '<tr><td><span class="chip" style="border:0;padding:0"><i style="background:'+l.c+'"><\/i><\/span> '+e.name+'<\/td><td>'+fd(e.pk)+'<\/td><td class="neg"><b>'+pct(mn[1])+'<\/b><\/td><td>'+dur(tv)+'<\/td><td>'+(e.on?'<span class="neg">未回復<\/span>':dur(rc))+'<\/td><td>'+(v==null?'—':'<b'+(v<0?' class="neg"':'')+'>'+pct(v)+'<\/b>')+'<\/td><\/tr>'}).join('')||'<tr><td colspan="6">暴落を選んでください<\/td><\/tr>';
 var rd=R.querySelector('.c-read');rd.innerHTML=d==null?'グラフをタップ（なぞる）と、その日数時点の下落率を表示':'<b>'+d+'日目<\/b>　'+L.map(function(l){var v=at(CACHE[l.e.id]||[],d);return '<span style="color:'+l.c+'">● '+short(l.e.name,l.e)+' '+(v==null?'—':pct(v))+'<\/span>'}).join('')}
function lead(L){
 var el=R.querySelector('.c-lead'),on=L.filter(function(l){return l.e.on})[0];
 if(!on){el.textContent='比べたい暴落を選ぶと、ピークからの下落の進み方を重ねて表示します。';return}
 var p=CACHE[on.e.id]||[];if(!p.length)return;var z=p[p.length-1],d=Math.round(z[0]),others=L.filter(function(l){return l!==on}).map(function(l){var v=at(CACHE[l.e.id]||[],d);return v==null?'':short(l.e.name,l.e)+'（'+new Date(l.e.pk).getUTCFullYear()+'年）は'+pct(v)}).filter(String);
 el.innerHTML='今回はピークから'+d+'日で'+pct(z[1])+'（最大'+pct(on.e.dd)+'）。'+(others.length?'同じ'+d+'日目の時点で、'+others.join('、')+'でした。':'')}
function similar(){
 var on=EV.filter(function(e){return e.on})[0],btn=R.querySelector('.c-sim');
 if(!on){btn.textContent='継続中の下落がありません';return}
 btn.textContent='計算中…';
 var go=function(){var p=CACHE[on.id]||slice(ALL,on),N=Math.round(p[p.length-1][0]),sc=[];
  EV.forEach(function(e){if(e.on)return;var q=slice(ALL,e),s=0,n=0;for(var d=0;d<=N;d+=3){var a=at(p,d),b=at(q,d);if(a==null||b==null)continue;s+=(a-b)*(a-b);n++}if(n>3)sc.push([e.id,Math.sqrt(s/n)])});
  sc.sort(function(a,b){return a[1]-b[1]});btn.textContent='今回に近い下落を探す';setSel([on.id].concat(sc.slice(0,4).map(function(x){return x[0]})))};
 if(ALL){go();return}
 get(DGID).then(function(t){var r=csv(t);r.shift();ALL=r.map(function(x){return [dt(x[0]),num(x[1])]}).filter(function(x){return x[0]!=null}).filter(function(x){return x[1]>0});go()}).catch(function(){btn.textContent='読み込みに失敗しました'})}
var DGID=2091119745;
get(257873827).then(init).catch(function(){R.querySelector('.c-lead').textContent='データを読み込めませんでした。時間をおいて再読み込みしてください。'})
})();
</script>
